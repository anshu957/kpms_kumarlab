# KeyPoint-MoSeq 10-Keypoint Configuration
# Auto-generated subset config (removes MID_TAIL, TIP_TAIL)
# Override via CLI arguments or create experiment-specific configs

# Model hyperparameters
kappa: 1e6                     # Stickiness parameter (higher = longer behavioral bouts)
arhmm_iters: 50                # AR-HMM iterations
full_model_iters: 400          # Full model iterations
mixed_map_iters: 4             # GPU memory management (higher = less memory, slower)
num_gpus: 1                    # Number of GPUs to use

# Data preprocessing
pose_version: "v6"             # JABS pose estimation version (v2 or v6)
validate_output: true          # Validate converted CSV files
overwrite: false               # Overwrite existing CSV files

# Bodyparts (10-keypoint mouse skeleton - removed mid/tip tail)
bodyparts:
  - "NOSE_INDEX"
  - "LEFT_EAR_INDEX"
  - "RIGHT_EAR_INDEX"
  - "BASE_NECK_INDEX"
  - "LEFT_FRONT_PAW_INDEX"
  - "RIGHT_FRONT_PAW_INDEX"
  - "CENTER_SPINE_INDEX"
  - "LEFT_REAR_PAW_INDEX"
  - "RIGHT_REAR_PAW_INDEX"
  - "BASE_TAIL_INDEX"

# Skeleton connections
skeleton:
  - ["BASE_TAIL_INDEX", "RIGHT_REAR_PAW_INDEX"]
  - ["BASE_TAIL_INDEX", "LEFT_REAR_PAW_INDEX"]
  - ["BASE_TAIL_INDEX", "CENTER_SPINE_INDEX"]
  - ["CENTER_SPINE_INDEX", "LEFT_FRONT_PAW_INDEX"]
  - ["CENTER_SPINE_INDEX", "RIGHT_FRONT_PAW_INDEX"]
  - ["CENTER_SPINE_INDEX", "BASE_NECK_INDEX"]
  - ["BASE_NECK_INDEX", "NOSE_INDEX"]

# Orientation bodyparts
anterior_bodyparts:
  - "BASE_NECK_INDEX"

posterior_bodyparts:
  - "BASE_TAIL_INDEX"

# Subset metadata
_subset_info:
  name: "10k"
  n_keypoints: 10
  removed_indices: [10, 11]
  source_config: "/flashscratch/chouda/kpms_combined_OFA/kpms_kumarlab/config/default.yml"
